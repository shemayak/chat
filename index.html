<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase One-Time Read (public)</title>
</head>
<body>

    <h2>Read Data (generated at build-time)</h2>
    <button id="readBtn">Load "test" Value</button>
    
    <p>Database Result: <strong id="resultDisplay">Click the button to load data...</strong></p>

    <script>
      // This client-side code runs in the browser and must never contain secrets.
      // It fetches a build-time generated file (/data.json) that was created by
      // a GitHub Actions build step which used a secret on the server-side.

      const readBtn = document.getElementById('readBtn');
      const resultDisplay = document.getElementById('resultDisplay');

      readBtn.addEventListener('click', async () => {
        resultDisplay.innerText = 'Loading...';
        try {
          const res = await fetch('/data.json', { cache: 'no-store' });
          if (!res.ok) {
            if (res.status === 404) {
              resultDisplay.innerText = 'Data not found. Make sure the Actions build has run and generated /data.json.';
            } else {
              resultDisplay.innerText = 'Failed to load data: ' + res.status + ' ' + res.statusText;
            }
            return;
          }

          const data = await res.json();
          // If the build script wrote the value under the key "test", show it
          if (data && Object.prototype.hasOwnProperty.call(data, 'test')) {
            resultDisplay.innerText = JSON.stringify(data.test);
          } else {
            // otherwise show the whole payload
            resultDisplay.innerText = JSON.stringify(data);
          }
        } catch (err) {
          console.error('Fetch error', err);
          resultDisplay.innerText = 'Error fetching data: ' + (err.message || err);
        }
      });
    </script>
</body>
</html>
