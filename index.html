<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase One-Time Read</title>
</head>
<body>

    <h2>Read Data From Firebase (One-Time)</h2>
    <button id="readBtn">Fetch "test" Value</button>
    
    <p>Database Result: <strong id="resultDisplay">Click the button to load data...</strong></p>

    <!-- Firebase v10 SDK Scripts via CDN -->
    <script type="module">
        // Import the necessary functions from the modern Firebase modular CDN
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, get } from "https://gstatic.com";

        // 1. YOUR FIREBASE CONFIGURATION
        // Fill these variables out using the credentials found in your Firebase Console Settings
const firebaseConfig = {
  apiKey: "AIzaSyDmyTC3MWk_i4kefgZbSnnlSpImO9w7yCg",
  authDomain: "my-porject-2-47293.firebaseapp.com",
  databaseURL: "https://my-porject-2-47293-default-rtdb.firebaseio.com",
  projectId: "my-porject-2-47293",
  storageBucket: "my-porject-2-47293.firebasestorage.app",
  messagingSenderId: "827212742968",
  appId: "1:827212742968:web:c3345bd5cc84c761cb41cd",
  measurementId: "G-H7Z98XVEFT"
};

        // 2. Initialize Firebase and Get Database Instance
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 3. UI Elements
        const readBtn = document.getElementById('readBtn');
        const resultDisplay = document.getElementById('resultDisplay');

        // 4. Fetch the data once when button is clicked
        readBtn.addEventListener('click', () => {
            resultDisplay.innerText = "Loading...";

            // Create a reference pointing directly to the 'test' key in your database
            const testRef = ref(db, 'test');

            // 'get()' fetches the value exactly once (not realtime)
            get(testRef).then((snapshot) => {
                if (snapshot.exists()) {
                    // Display the grabbed value on the screen
                    resultDisplay.innerText = JSON.stringify(snapshot.val());
                } else {
                    resultDisplay.innerText = "No data available at path 'test'.";
                }
            }).catch((error) => {
                console.error("Error pulling data:", error);
                resultDisplay.innerText = "Error: " + error.message;
            });
        });
    </script>
</body>
</html>
